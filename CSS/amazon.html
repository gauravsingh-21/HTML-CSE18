<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Amazon Clone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background:#e3e6e6;
}

/* HEADER */
header{
    background:#131921;
    color:white;
    padding:10px 20px;
    display:flex;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#f3a847;
}

.search{
    flex:1;
    margin:0 20px;
    display:flex;
}

.search input{
    width:100%;
    padding:10px;
    border:none;
}

.search button{
    padding:10px;
    background:#febd69;
    border:none;
    cursor:pointer;
}

.cart{
    font-size:18px;
    cursor:pointer;
}

/* CATEGORY BAR */
.categories{
    background:#232f3e;
    color:white;
    padding:10px;
}

.categories span{
    margin-right:15px;
    cursor:pointer;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:5px;
}

.card img{
    width:100%;
    height:200px;
    object-fit:contain;
}

.card h3{
    margin:10px 0;
}

.card p{
    font-weight:bold;
}

.card button{
    width:100%;
    padding:8px;
    background:#ffd814;
    border:none;
    cursor:pointer;
}

/* CART SECTION */
#cartBox{
    background:white;
    padding:20px;
    margin:20px;
    display:none;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.cart-item button{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#131921;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<header>
    <div class="logo">amazon</div>

    <div class="search">
        <input type="text" id="searchInput" placeholder="Search products">
        <button onclick="searchProduct()">Search</button>
    </div>

    <div class="cart" onclick="toggleCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </div>
</header>

<div class="categories">
    <span>All</span>
    <span>Mobiles</span>
    <span>Fashion</span>
    <span>Electronics</span>
    <span>Home</span>
</div>

<!-- PRODUCTS -->
<div class="products" id="productList">
    <div class="card">
        <img src="https://m.media-amazon.com/images/I/71zDOv2yJQL._AC_UY218_.jpg">
        <h3>Smartphone</h3>
        <p>₹12,999</p>
        <button onclick="addToCart('Smartphone',12999)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/71TPda7cwUL._AC_UY218_.jpg">
        <h3>Laptop</h3>
        <p>₹45,999</p>
        <button onclick="addToCart('Laptop',45999)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/61u1VALn6JL._AC_UY218_.jpg">
        <h3>Headphones</h3>
        <p>₹1,999</p>
        <button onclick="addToCart('Headphones',1999)">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/61Vx3yK5ZUL._AC_UY218_.jpg">
        <h3>Watch</h3>
        <p>₹2,499</p>
        <button onclick="addToCart('Watch',2499)">Add to Cart</button>
    </div>
</div>

<!-- CART -->
<div id="cartBox">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
</div>

<footer>
    © 2025 Amazon Clone | HTML CSS JavaScript
</footer>

<script>
let cart = [];
let total = 0;

function addToCart(name, price){
    cart.push({name, price});
    total += price;
    document.getElementById("cartCount").innerText = cart.length;
    updateCart();
}

function updateCart(){
    let cartItems = document.getElementById("cartItems");
    cartItems.innerHTML = "";

    cart.forEach((item, index)=>{
        cartItems.innerHTML += `
        <div class="cart-item">
            <span>${item.name} - ₹${item.price}</span>
            <button onclick="removeItem(${index})">Remove</button>
        </div>`;
    });

    document.getElementById("total").innerText = total;
}

function removeItem(index){
    total -= cart[index].price;
    cart.splice(index,1);
    document.getElementById("cartCount").innerText = cart.length;
    updateCart();
}

function toggleCart(){
    let box = document.getElementById("cartBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
}

function searchProduct(){
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".card");

    cards.forEach(card=>{
        let name = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = name.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
